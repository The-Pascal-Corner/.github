<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" shape-rendering="crispEdges">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&amp;display=swap');
    </style>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <rect width="32" height="32" fill="none"/>
      <rect width="32" height="32" fill="none" stroke="#ccc" stroke-width="1"/>
    </pattern>
    <g id="bird">
      <rect x="0" y="0" width="4" height="4" fill="#666"/>
      <rect x="4" y="-4" width="4" height="4" fill="#666"/>
      <rect x="8" y="0" width="4" height="4" fill="#666"/>
    </g>
  </defs>

  <rect width="1280" height="640" fill="#eaeaea"/>
  <rect width="1280" height="640" fill="url(#grid)"/>

  <!-- Outer frame -->
  <rect x="20" y="20" width="1240" height="6" fill="#ccc"/>
  <rect x="20" y="614" width="1240" height="6" fill="#ccc"/>
  <rect x="20" y="20" width="6" height="600" fill="#ccc"/>
  <rect x="1254" y="20" width="6" height="600" fill="#ccc"/>
  <rect x="26" y="26" width="1228" height="2" fill="#aaa"/>
  <rect x="26" y="612" width="1228" height="2" fill="#aaa"/>
  <rect x="26" y="26" width="2" height="588" fill="#aaa"/>
  <rect x="1252" y="26" width="2" height="588" fill="#aaa"/>

  <!-- Screen area -->
  <rect x="28" y="28" width="1224" height="584" fill="#f0f0f0"/>

  <!-- Decorative corner flourishes -->
  <g fill="#ddd">
    <!-- Top-left -->
    <rect x="40" y="40" width="40" height="6"/>
    <rect x="40" y="40" width="6" height="40"/>
    <!-- Top-right -->
    <rect x="1194" y="40" width="40" height="6"/>
    <rect x="1228" y="40" width="6" height="40"/>
  </g>

  <!-- === LOGO MARK (L-bracket + star) centered at top === -->
  <g transform="translate(584, 60)">
    <!-- Horizontal arm -->
    <rect x="0" y="0" width="112" height="14" fill="#888"/>
    <rect x="0" y="0" width="112" height="4" fill="#333"/>
    <rect x="0" y="10" width="112" height="4" fill="#ccc"/>
    <rect x="106" y="3" width="6" height="8" fill="#1a1a1a"/>
    <!-- Vertical arm -->
    <rect x="0" y="0" width="14" height="112" fill="#888"/>
    <rect x="0" y="0" width="4" height="112" fill="#333"/>
    <rect x="10" y="0" width="4" height="112" fill="#ccc"/>
    <rect x="3" y="106" width="8" height="6" fill="#1a1a1a"/>
    <!-- Inner area -->
    <rect x="14" y="14" width="98" height="98" fill="#eaeaea"/>
    <!-- Star (5x5 grid, 12px blocks) -->
    <g fill="#1a1a1a">
      <rect x="53" y="26" width="12" height="12"/>
      <rect x="41" y="38" width="12" height="12"/>
      <rect x="53" y="38" width="12" height="12"/>
      <rect x="65" y="38" width="12" height="12"/>
      <rect x="29" y="50" width="12" height="12"/>
      <rect x="41" y="50" width="12" height="12"/>
      <rect x="53" y="50" width="12" height="12"/>
      <rect x="65" y="50" width="12" height="12"/>
      <rect x="77" y="50" width="12" height="12"/>
      <rect x="41" y="62" width="12" height="12"/>
      <rect x="53" y="62" width="12" height="12"/>
      <rect x="65" y="62" width="12" height="12"/>
      <rect x="53" y="74" width="12" height="12"/>
    </g>
    <!-- Star glow -->
    <g fill="#bbb">
      <rect x="53" y="14" width="4" height="4"/>
      <rect x="65" y="14" width="4" height="4"/>
      <rect x="24" y="50" width="4" height="4"/>
      <rect x="90" y="50" width="4" height="4"/>
      <rect x="53" y="88" width="4" height="4"/>
      <rect x="65" y="88" width="4" height="4"/>
    </g>
  </g>

  <!-- === WORDMARK === -->
  <!-- "THE" -->
  <text x="640" y="220" font-family="'Press Start 2P',monospace" font-size="18" fill="#888" text-anchor="middle" letter-spacing="6">THE</text>

  <!-- "PASCAL" (biggest) -->
  <text x="640" y="300" font-family="'Press Start 2P',monospace" font-size="68" fill="#1a1a1a" text-anchor="middle" letter-spacing="4">PASCAL</text>

  <!-- "CORNER" -->
  <text x="640" y="370" font-family="'Press Start 2P',monospace" font-size="52" fill="#333" text-anchor="middle" letter-spacing="4">CORNER</text>

  <!-- Pixel divider -->
  <rect x="440" y="400" width="400" height="4" fill="#ccc"/>
  <rect x="460" y="404" width="360" height="2" fill="#aaa"/>

  <!-- Small bracket accents flanking the divider -->
  <rect x="400" y="398" width="6" height="8" fill="#ddd"/>
  <rect x="398" y="400" width="8" height="4" fill="#ddd"/>
  <rect x="874" y="398" width="6" height="8" fill="#ddd"/>
  <rect x="874" y="400" width="8" height="4" fill="#ddd"/>

  <!-- === LIGHT MORNING PIXEL ART MOUNTAINS === -->
  <!-- Mist layer -->
  <rect x="28" y="460" width="1224" height="30" fill="#e0e0e0" opacity="0.4"/>

  <!-- Far mountain range -->
  <g fill="#c0c0c0">
    <rect x="28" y="490" width="1224" height="122"/>
    <rect x="100" y="458" width="8" height="20"/>
    <rect x="108" y="440" width="8" height="38"/>
    <rect x="116" y="425" width="8" height="53"/>
    <rect x="124" y="415" width="8" height="63"/>
    <rect x="132" y="425" width="8" height="53"/>
    <rect x="140" y="440" width="8" height="38"/>
    <rect x="148" y="458" width="8" height="20"/>
  </g>

  <!-- Mid mountain -->
  <g fill="#aaa">
    <rect x="380" y="460" width="8" height="18"/>
    <rect x="388" y="435" width="8" height="43"/>
    <rect x="396" y="415" width="8" height="63"/>
    <rect x="404" y="398" width="8" height="80"/>
    <rect x="412" y="388" width="8" height="90"/>
    <rect x="420" y="382" width="8" height="96"/>
    <rect x="428" y="388" width="8" height="90"/>
    <rect x="436" y="398" width="8" height="80"/>
    <rect x="444" y="415" width="8" height="63"/>
    <rect x="452" y="435" width="8" height="43"/>
    <rect x="460" y="460" width="8" height="18"/>
  </g>

  <!-- Mid mountain snow cap -->
  <g fill="#ddd">
    <rect x="412" y="388" width="8" height="8"/>
    <rect x="420" y="382" width="8" height="8"/>
    <rect x="428" y="388" width="8" height="8"/>
  </g>

  <!-- Right mountain -->
  <g fill="#c0c0c0">
    <rect x="750" y="460" width="8" height="18"/>
    <rect x="758" y="445" width="8" height="33"/>
    <rect x="766" y="430" width="8" height="48"/>
    <rect x="774" y="420" width="8" height="58"/>
    <rect x="782" y="415" width="8" height="63"/>
    <rect x="790" y="420" width="8" height="58"/>
    <rect x="798" y="430" width="8" height="48"/>
    <rect x="806" y="445" width="8" height="33"/>
    <rect x="814" y="460" width="8" height="18"/>
  </g>

  <!-- Close right mountain -->
  <g fill="#aaa">
    <rect x="1010" y="460" width="8" height="18"/>
    <rect x="1018" y="440" width="8" height="38"/>
    <rect x="1026" y="425" width="8" height="53"/>
    <rect x="1034" y="412" width="8" height="66"/>
    <rect x="1042" y="408" width="8" height="70"/>
    <rect x="1050" y="412" width="8" height="66"/>
    <rect x="1058" y="425" width="8" height="53"/>
    <rect x="1066" y="440" width="8" height="38"/>
    <rect x="1074" y="460" width="8" height="18"/>
  </g>

  <!-- Right mountain snow cap -->
  <g fill="#ddd">
    <rect x="1034" y="412" width="8" height="8"/>
    <rect x="1042" y="408" width="8" height="8"/>
    <rect x="1050" y="412" width="8" height="8"/>
  </g>

  <!-- Ground -->
  <rect x="28" y="478" width="1224" height="2" fill="#bbb"/>

  <!-- Pixel trees -->
  <g fill="#999">
    <rect x="640" y="462" width="4" height="16"/>
    <rect x="636" y="458" width="12" height="4"/>
    <rect x="636" y="454" width="12" height="4"/>
    <rect x="900" y="462" width="4" height="16"/>
    <rect x="896" y="458" width="12" height="4"/>
    <rect x="896" y="454" width="12" height="4"/>
  </g>

  <!-- Birds -->
  <use href="#bird" x="340" y="120"/>
  <use href="#bird" x="360" y="105"/>
  <use href="#bird" x="900" y="130"/>
  <use href="#bird" x="920" y="115"/>

  <!-- Sun pixels in the sky -->
  <g fill="#ccc">
    <rect x="620" y="40" width="6" height="6"/>
    <rect x="626" y="46" width="6" height="6"/>
    <rect x="614" y="46" width="6" height="6"/>
    <rect x="614" y="34" width="6" height="6"/>
    <rect x="626" y="34" width="6" height="6"/>
  </g>
</svg>
